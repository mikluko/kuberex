apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kuberex.labels" . | nindent 4 }}
spec:
  # One server owns the state in /var/lib/rex and the tailnet node.
  replicas: 1
  selector:
    matchLabels:
      {{- include "kuberex.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuberex.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Accounts and packages are set up at start, so a change restarts the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kuberex.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        {{- if lt (int .Values.tailscale.port) 1024 }}
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: {{ .Values.tailscale.port | quote }}
        {{- end }}
      {{- with .Values.tailscale }}
      initContainers:
        - name: tailscale
          image: {{ .image.repository }}:{{ .image.tag }}
          imagePullPolicy: {{ .image.pullPolicy }}
          restartPolicy: Always
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/rex/tailscaled
            - name: TS_SOCKET
              value: /run/tailscale/tailscaled.sock
            - name: TS_HOSTNAME
              value: {{ $.Values.tailscale.hostname | quote }}
            - name: TS_AUTH_ONCE
              value: "true"
            {{- with $.Values.tailscale.controlURL }}
            - name: TS_EXTRA_ARGS
              value: {{ printf "--login-server=%s" . | quote }}
            {{- end }}
            {{- with $.Values.tailscale.authKey.existingSecret }}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.tailscale.authKey.key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/rex
            - name: tailscale
              mountPath: /run/tailscale
            - name: tmp
              mountPath: /tmp
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: rex
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TS_SOCKET
              value: /run/tailscale/tailscaled.sock
            - name: REX_TAILNET_PORT
              value: {{ .Values.tailscale.port | quote }}
            - name: REX_LOGIN_SERVER_ACCOUNTS
              value: /etc/kuberex/accounts.jsonc
            {{- if or .Values.apt.sources .Values.apt.packages }}
            - name: KUBEREX_APT
              value: /etc/kuberex/apt
            {{- end }}
            {{- if .Values.accountSecrets }}
            - name: KUBEREX_SECRETS
              value: /etc/kuberex/secrets
            {{- end }}
            {{- if .Values.services }}
            - name: KUBEREX_SERVICES
              value: /etc/kuberex/services.json
            {{- end }}
            {{- with .Values.shutdownAccounts }}
            - name: KUBEREX_SHUTDOWN_ACCOUNTS
              value: {{ join " " . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          # Root that creates the accounts, installs packages, and starts and
          # stops each account's server.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
          volumeMounts:
            - name: state
              mountPath: /var/lib/rex
            - name: state
              mountPath: /home
              subPath: home
            - name: config
              mountPath: /etc/kuberex/accounts.jsonc
              subPath: accounts.jsonc
              readOnly: true
            {{- range $account, $secrets := .Values.accountSecrets }}
            {{- range $secret := $secrets }}
            - name: {{ include "kuberex.accountSecretVolume" (list $account $secret) }}
              mountPath: /etc/kuberex/secrets/{{ $account }}/{{ $secret }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.services }}
            - name: config
              mountPath: /etc/kuberex/services.json
              subPath: services.json
              readOnly: true
            {{- end }}
            {{- if or .Values.apt.sources .Values.apt.packages }}
            - name: apt
              mountPath: /etc/kuberex/apt
              readOnly: true
            {{- end }}
            - name: run
              mountPath: /run/rex
            - name: tmp
              mountPath: /tmp
            - name: tailscale
              mountPath: /run/tailscale
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- with .Values.stateVolume }}
        - name: state
          {{- toYaml . | nindent 10 }}
        {{- end }}
        - name: run
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Release.Name }}
        {{- if or .Values.apt.sources .Values.apt.packages }}
        - name: apt
          configMap:
            name: {{ .Release.Name }}
            items:
              {{- range $name, $_ := .Values.apt.sources }}
              - key: source-{{ $name }}
                path: sources/{{ $name }}.sources
              {{- end }}
              {{- range $name, $_ := .Values.apt.keyrings }}
              - key: keyring-{{ $name }}
                path: keyrings/{{ $name }}
              {{- end }}
              {{- if .Values.apt.packages }}
              - key: packages
                path: packages
              {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: tailscale
          emptyDir: {}
        {{- range $account, $secrets := .Values.accountSecrets }}
        {{- range $secret := $secrets }}
        - name: {{ include "kuberex.accountSecretVolume" (list $account $secret) }}
          secret:
            secretName: {{ $secret }}
            defaultMode: 0400
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if not .Values.stateVolume }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
