{{- if not (.Values.accounts).accounts }}
{{- fail "accounts.accounts names no account: the login server would admit nobody" }}
{{- end }}
{{- range $account, $_ := .Values.accountSecrets }}
{{- if or (eq $account "*") (not (hasKey $.Values.accounts.accounts $account)) }}
{{- fail (printf "accountSecrets: account %q is not named in accounts.accounts" $account) }}
{{- end }}
{{- end }}
{{- range $i, $s := .Values.services }}
{{- if or (not $s.account) (not $s.label) (not $s.command) }}
{{- fail (printf "services[%d] needs account, label and command" $i) }}
{{- end }}
{{- if or (eq $s.account "*") (not (hasKey $.Values.accounts.accounts $s.account)) }}
{{- fail (printf "services[%d]: account %q is not named in accounts.accounts" $i $s.account) }}
{{- end }}
{{- end }}
{{- range .Values.shutdownAccounts }}
{{- if or (eq . "*") (not (hasKey $.Values.accounts.accounts .)) }}
{{- fail (printf "shutdownAccounts: account %q is not named in accounts.accounts" .) }}
{{- end }}
{{- end }}
{{- range .Values.keepServers }}
{{- if or (eq . "*") (not (hasKey $.Values.accounts.accounts .)) }}
{{- fail (printf "keepServers: account %q is not named in accounts.accounts" .) }}
{{- end }}
{{- end }}
{{- range $i, $c := .Values.accountContainers }}
{{- if or (not $c.name) (not $c.account) (not $c.command) }}
{{- fail (printf "accountContainers[%d] needs name, account and command" $i) }}
{{- end }}
{{- if or (eq $c.account "*") (not (hasKey $.Values.accounts.accounts $c.account)) }}
{{- fail (printf "accountContainers[%d]: account %q is not named in accounts.accounts" $i $c.account) }}
{{- end }}
{{- if has $c.name (list "rex" "tailscale") }}
{{- fail (printf "accountContainers[%d]: name %q is the chart's own container" $i $c.name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kuberex.labels" . | nindent 4 }}
data:
  accounts.jsonc: {{ .Values.accounts | toJson | quote }}
  {{- with .Values.services }}
  services.json: {{ . | toJson | quote }}
  {{- end }}
  {{- range $name, $content := .Values.apt.sources }}
  source-{{ $name }}: {{ $content | quote }}
  {{- end }}
  {{- range $name, $content := .Values.apt.keyrings }}
  keyring-{{ $name }}: {{ $content | quote }}
  {{- end }}
  {{- with .Values.apt.packages }}
  packages: {{ join "\n" . | quote }}
  {{- end }}
