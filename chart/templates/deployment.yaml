apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "kuberex.labels" . | nindent 4 }}
spec:
  {{- if and .Values.loginServer.enabled (not .Values.tailscale.sidecar.enabled) }}
  {{- fail "loginServer.enabled needs tailscale.sidecar.enabled" }}
  {{- end }}
  # One server owns the state in /var/lib/rex and the tailnet node.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kuberex.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuberex.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.loginServer.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.loginServer.enabled }}
        # Accounts are created at start, so a change restarts the pod.
        checksum/login-server: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kuberex.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        {{- if and .Values.tailscale.sidecar.enabled (lt (int .Values.tailscale.sidecar.port) 1024) }}
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: {{ .Values.tailscale.sidecar.port | quote }}
        {{- end }}
      {{- with .Values.tailscale.sidecar }}
      {{- if .enabled }}
      initContainers:
        - name: tailscale
          image: {{ .image.repository }}:{{ .image.tag }}
          imagePullPolicy: {{ .image.pullPolicy }}
          restartPolicy: Always
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: /var/lib/rex/tailscaled
            - name: TS_SOCKET
              value: /run/tailscale/tailscaled.sock
            - name: TS_HOSTNAME
              value: {{ $.Values.tailscale.hostname | quote }}
            - name: TS_AUTH_ONCE
              value: "true"
            {{- with $.Values.tailscale.controlURL }}
            - name: TS_EXTRA_ARGS
              value: {{ printf "--login-server=%s" . | quote }}
            {{- end }}
            {{- with $.Values.tailscale.authKey.existingSecret }}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.tailscale.authKey.key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/rex
            - name: tailscale
              mountPath: /run/tailscale
            - name: tmp
              mountPath: /tmp
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: rex
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.tailscale.sidecar.enabled }}
            - name: TS_SOCKET
              value: /run/tailscale/tailscaled.sock
            - name: REX_TAILNET_PORT
              value: {{ .Values.tailscale.sidecar.port | quote }}
            {{- else }}
            - name: TS_HOSTNAME
              value: {{ .Values.tailscale.hostname | quote }}
            {{- with .Values.tailscale.controlURL }}
            - name: TS_CONTROL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.tailscale.authKey.existingSecret }}
            - name: TS_AUTHKEY_FILE
              value: /etc/rex-tailscale/authkey
            {{- end }}
            {{- end }}
            {{- if .Values.loginServer.enabled }}
            - name: REX_LOGIN_SERVER_ACCOUNTS
              value: /etc/kuberex/login-server/accounts.jsonc
            {{- end }}
            {{- if .Values.tailscale.allowTailnetMembers }}
            - name: REX_ALLOW_TAILNET_MEMBERS
              value: "true"
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.loginServer.enabled }}
            # Root that creates the accounts in /etc, enters /var/lib/rex
            # whoever owns it, and starts and stops each account's server.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
            {{- else }}
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            {{- end }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/rex
            {{- if .Values.loginServer.enabled }}
            - name: login-server
              mountPath: /etc/kuberex/login-server
              readOnly: true
            {{- end }}
            - name: run
              mountPath: /run/rex
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tailscale.sidecar.enabled }}
            - name: tailscale
              mountPath: /run/tailscale
            {{- else if .Values.tailscale.authKey.existingSecret }}
            - name: authkey
              mountPath: /etc/rex-tailscale
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: state
          {{- with .Values.stateVolume }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: run
          emptyDir: {}
        {{- if .Values.loginServer.enabled }}
        - name: login-server
          configMap:
            name: {{ .Release.Name }}-login-server
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.tailscale.sidecar.enabled }}
        - name: tailscale
          emptyDir: {}
        {{- else }}
        {{- with .Values.tailscale.authKey.existingSecret }}
        - name: authkey
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: {{ $.Values.tailscale.authKey.key }}
                path: authkey
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
