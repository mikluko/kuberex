image:
  tag: "0.11.0"
serviceAccount:
  name: rex
  automountToken: true
tailscale:
  hostname: kuberex
  controlURL: https://headscale.example.com
  authKey:
    existingSecret: rex-tailscale
  port: 80
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
accounts:
  version: 1
  accounts:
    alice:
      principals: ["tailscale:alice@example.com"]
    bob:
      principals: ["tailscale:bob@example.com"]
  defaults:
    tailscale:alice@example.com: alice
services:
  - account: bob
    label: supervisor
    cwd: /home/bob/city
    command: ["gc", "supervisor", "run"]
apt:
  sources:
    example: |
      Types: deb
      URIs: https://apt.example.com/debian
      Suites: trixie
      Components: main
      Signed-By: /etc/apt/keyrings/example.asc
  keyrings:
    example.asc: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----
      example
      -----END PGP PUBLIC KEY BLOCK-----
  packages:
    - example-tool
stateVolume:
  hostPath:
    path: /srv/rex
    type: Directory
networkPolicy:
  enabled: true
env:
  TZ: UTC
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi
podAnnotations:
  example.com/note: full
podLabels:
  example.com/tier: workstation
nodeSelector:
  kubernetes.io/hostname: example
tolerations:
  - key: example.com/workstation
    operator: Exists
