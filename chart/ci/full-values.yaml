image:
  tag: "0.11.0"
serviceAccount:
  name: rex
  automountToken: true
tailscale:
  hostname: kuberex
  controlURL: https://headscale.example.com
  authKey:
    existingSecret: rex-tailscale
  port: 80
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
accounts:
  version: 1
  accounts:
    alice:
      principals: ["tailscale:alice@example.com"]
    bob:
      principals: ["tailscale:bob@example.com"]
  defaults:
    tailscale:alice@example.com: alice
accountSecrets:
  bob: [bob-git, bob-github]
services:
  - account: bob
    label: supervisor
    cwd: /home/bob/city
    command: ["gc", "supervisor", "run"]
shutdownAccounts: [bob]
keepServers: [bob]
accountContainers:
  - name: supervisor
    account: bob
    cwd: /home/bob/city
    command: ["gc", "supervisor", "run"]
    image:
      repository: sarak.sh/example/city
      tag: "1.0.0"
    env:
      GC_LOG: debug
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    volumeMounts:
      - name: example
        mountPath: /etc/example
        readOnly: true
  - name: watch
    account: alice
    command: ["jmap-watch", "-health-addr", ":8081"]
    startupProbe:
      httpGet:
        path: /healthz
        port: 8081
      periodSeconds: 10
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8081
shareProcessNamespace: true
apt:
  sources:
    example: |
      Types: deb
      URIs: https://apt.example.com/debian
      Suites: trixie
      Components: main
      Signed-By: /etc/apt/keyrings/example.asc
  keyrings:
    example.asc: |
      -----BEGIN PGP PUBLIC KEY BLOCK-----
      example
      -----END PGP PUBLIC KEY BLOCK-----
  packages:
    - example-tool
stateVolume:
  hostPath:
    path: /srv/rex
    type: Directory
networkPolicy:
  enabled: true
env:
  TZ: UTC
extraVolumes:
  - name: example
    configMap:
      name: example
extraVolumeMounts:
  - name: example
    mountPath: /etc/example
    readOnly: true
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi
podAnnotations:
  example.com/note: full
podLabels:
  example.com/tier: workstation
nodeSelector:
  kubernetes.io/hostname: example
tolerations:
  - key: example.com/workstation
    operator: Exists
