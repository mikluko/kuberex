tailscale:
  hostname: kuberex
  controlURL: https://headscale.example.com
  authKey:
    existingSecret: rex-tailscale
  allowTailnetMembers: true
  sidecar:
    enabled: true
    port: 80
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
stateVolume:
  hostPath:
    path: /srv/rex
    type: Directory
networkPolicy:
  enabled: true
