image:
  # Image of the Rex server.
  repository: sarak.sh/mikluko/kuberex
  # Image tag; the chart's appVersion when empty.
  tag: ""
  # Pull policy of the image.
  pullPolicy: IfNotPresent

# Image pull secrets of the pod.
imagePullSecrets: []

serviceAccount:
  # Creates the ServiceAccount; when false, the named one must exist.
  create: true
  # Name of the ServiceAccount; the release name when empty.
  name: ""
  # Mounts the ServiceAccount token into the pod.
  automountToken: false

tailscale:
  # TS_HOSTNAME, the server's tailnet hostname.
  hostname: kuberex
  # TS_CONTROL_URL, the control server; Tailscale's when empty.
  controlURL: ""
  authKey:
    # Secret holding the one-time join key; none when empty, for a node already enrolled.
    existingSecret: ""
    # Key of the join key in the Secret.
    key: authkey
  # REX_ALLOW_TAILNET_MEMBERS: admits every tailnet member the ACLs let through, not only the node's owner. A node joined with a tagged key has no owner and needs it.
  allowTailnetMembers: false
  sidecar:
    # Joins the tailnet through a tailscaled container in userspace networking, its state in /var/lib/rex/tailscaled, and serves the server as plain HTTP on port; for a control server that issues no HTTPS certificates, such as Headscale. When false, the server joins as an embedded node and serves HTTPS.
    enabled: false
    # REX_TAILNET_PORT, the server's tailnet port; below 1024 the pod sets net.ipv4.ip_unprivileged_port_start to it.
    port: 80
    image:
      # Image of tailscaled.
      repository: tailscale/tailscale
      # Image tag of tailscaled.
      tag: v1.104.4
      # Pull policy of the image.
      pullPolicy: IfNotPresent
    # Resources of the tailscaled container.
    resources: {}

# Volume source of /var/lib/rex, the server's state, its tailnet node state and the home of rex, rendered as given: such as hostPath or persistentVolumeClaim; an emptyDir when empty.
stateVolume: {}

networkPolicy:
  # Renders a CiliumNetworkPolicy allowing egress only to kube-dns, the kube-apiserver and outside the cluster.
  enabled: false

# Extra environment variables of the server and its terminals, name to value.
env: {}

# Resources of the container.
resources: {}
# Annotations of the pod.
podAnnotations: {}
# Labels of the pod.
podLabels: {}
# Node selector of the pod.
nodeSelector: {}
# Tolerations of the pod.
tolerations: []
# Affinity of the pod.
affinity: {}
