image:
  # Image of the Rex server.
  repository: sarak.sh/mikluko/kuberex
  # Image tag; the chart's appVersion when empty.
  tag: ""
  # Pull policy of the image.
  pullPolicy: IfNotPresent

# Image pull secrets of the pod.
imagePullSecrets: []

serviceAccount:
  # Creates the ServiceAccount; when false, the named one must exist.
  create: true
  # Name of the ServiceAccount; the release name when empty.
  name: ""
  # Mounts the ServiceAccount token into the pod.
  automountToken: false

tailscale:
  # The node's tailnet hostname.
  hostname: kuberex
  # The control server, such as a Headscale server; Tailscale's when empty.
  controlURL: ""
  authKey:
    # Secret holding the one-time auth key; none when empty, for a node already enrolled.
    existingSecret: ""
    # Key of the auth key in the Secret.
    key: authkey
  # Tailnet port the login server serves plain HTTP on; below 1024 the pod sets net.ipv4.ip_unprivileged_port_start to it.
  port: 80
  image:
    # Image of tailscaled, which runs as a sidecar in userspace networking with its state in /var/lib/rex/tailscaled.
    repository: tailscale/tailscale
    # Image tag of tailscaled.
    tag: v1.104.4
    # Pull policy of the image.
    pullPolicy: IfNotPresent
  # Resources of the tailscaled container.
  resources: {}

# The login server's accounts file, rendered as JSON: version, accounts and defaults; it decides who gets in and as which account. See https://www.superlogical.com/rex/docs/linux/login-server#accounts-file. The pod creates every account it names, but root and "*", at start, with zsh and a home in /home/<name>, kept in home/ of the state volume; an existing home keeps its owner's uid.
accounts: {}

apt:
  # Apt sources added at every start, file name without .sources to deb822 content. A Signed-By path names a keyring in /etc/apt/keyrings.
  sources: {}
  # Keyrings for those sources, file name in /etc/apt/keyrings to its content, such as an ASCII-armored key.
  keyrings: {}
  # Packages installed at every start, as apt-get install arguments, such as name or name=version.
  packages: []

persistence:
  # Size of the PersistentVolumeClaim the StatefulSet creates for /var/lib/rex, the server's state, its tailnet node state and the homes. A StatefulSet cannot change its claim template, so a change needs the StatefulSet deleted with --cascade=orphan first.
  size: 10Gi
  # Storage class of that claim; the cluster's default when empty.
  storageClassName: ""

# Volume source of /var/lib/rex, rendered as given, such as hostPath, in place of the claim persistence describes.
stateVolume: {}

networkPolicy:
  # Renders a CiliumNetworkPolicy allowing egress only to kube-dns, the kube-apiserver and outside the cluster.
  enabled: false

# Extra environment variables of the server and its terminals, name to value.
env: {}

# Resources of the container.
resources: {}
# Annotations of the pod.
podAnnotations: {}
# Labels of the pod.
podLabels: {}
# Node selector of the pod.
nodeSelector: {}
# Tolerations of the pod.
tolerations: []
# Affinity of the pod.
affinity: {}
