image:
  # Image of the Rex server.
  repository: sarak.sh/mikluko/kuberex
  # Image tag; the chart's appVersion when empty.
  tag: ""
  # Pull policy of the image.
  pullPolicy: IfNotPresent

# Image pull secrets of the pod.
imagePullSecrets: []

serviceAccount:
  # Creates the ServiceAccount; when false, the named one must exist.
  create: true
  # Name of the ServiceAccount; the release name when empty.
  name: ""
  # Mounts the ServiceAccount token into the pod.
  automountToken: false

tailscale:
  # The node's tailnet hostname.
  hostname: kuberex
  # The control server, such as a Headscale server; Tailscale's when empty.
  controlURL: ""
  authKey:
    # Secret holding the one-time auth key; none when empty, for a node already enrolled.
    existingSecret: ""
    # Key of the auth key in the Secret.
    key: authkey
  # Tailnet port the login server serves plain HTTP on; below 1024 the pod sets net.ipv4.ip_unprivileged_port_start to it.
  port: 80
  image:
    # Image of tailscaled, which runs as a sidecar in userspace networking with its state in /var/lib/rex/tailscaled.
    repository: tailscale/tailscale
    # Image tag of tailscaled.
    tag: v1.104.4
    # Pull policy of the image.
    pullPolicy: IfNotPresent
  # Resources of the tailscaled container.
  resources: {}

# The login server's accounts file, rendered as JSON: version, accounts and defaults; it decides who gets in and as which account. See https://www.superlogical.com/rex/docs/linux/login-server#accounts-file. The pod creates every account it names, but root and "*", at start, with zsh and a home in /home/<name>, kept in home/ of the state volume; an existing home keeps its owner's uid.
accounts: {}

# Secrets an account can read, account name (named in accounts.accounts) to a list of Secret names in the release's namespace. At every start each Secret's keys are copied to /run/kuberex/secrets/<account>/<secret>/<key>, owned by the account with mode 0400 and readable by no other account; a change to a Secret reaches the account at the next start.
accountSecrets: {}

# Commands started at every start, each in a Rex session of its account's own server: account (named in accounts.accounts), label (the session's), command (a list of arguments, run through the account's login shell environment) and optionally cwd. A session that already carries the label, restored from before the restart, is replaced. A command that exits is not restarted; its terminal stays open.
services: []

# Accounts (named in accounts.accounts) that may shut the server container down with "kuberexctl shutdown": every account's Rex server stops cleanly and the container exits with code 0. The pod's restart policy, Always, then starts it again.
shutdownAccounts: []

# Accounts (named in accounts.accounts) whose Rex servers run from the start of the server container to its end, without a session holding them, for processes outside Rex such as an account container's. Started again whenever one is gone.
keepServers: []

# Containers of the pod running a command as an account, from the chart's image or one built on it: name (the container's), account (named in accounts.accounts), command (a list of arguments, run directly, not through a shell) and optionally cwd (the account's home when empty), image (repository, tag and pullPolicy, each defaulting to image's), env (name to value, over env), resources, volumeMounts (mounts of extraVolumes), and livenessProbe, readinessProbe and startupProbe (each rendered as given, none when unset). Each shares the server container's /home, /run/rex, /run/kuberex and /tmp, starts once the server container has set the accounts up, and, when its account is in keepServers, once the account's Rex server accepts connections. It runs as the account's uid, with the account's Rex server as its Rex server and its account Secrets in /run/kuberex/secrets/<account>.
accountContainers: []

# Shares one process namespace among the pod's containers, so that an account container sees the processes of its account's Rex sessions.
shareProcessNamespace: false

apt:
  # Apt sources added at every start, file name without .sources to deb822 content. A Signed-By path names a keyring in /etc/apt/keyrings.
  sources: {}
  # Keyrings for those sources, file name in /etc/apt/keyrings to its content, such as an ASCII-armored key.
  keyrings: {}
  # Packages installed at every start, as apt-get install arguments, such as name or name=version.
  packages: []

persistence:
  # Size of the PersistentVolumeClaim the StatefulSet creates for /var/lib/rex, the server's state, its tailnet node state and the homes. A StatefulSet cannot change its claim template, so a change needs the StatefulSet deleted with --cascade=orphan first.
  size: 10Gi
  # Storage class of that claim; the cluster's default when empty.
  storageClassName: ""

# Volume source of /var/lib/rex, rendered as given, such as hostPath, in place of the claim persistence describes.
stateVolume: {}

networkPolicy:
  # Renders a CiliumNetworkPolicy allowing egress only to kube-dns, the kube-apiserver and outside the cluster.
  enabled: false

# Extra environment variables of the server and its terminals, name to value.
env: {}

# Volumes added to the pod, rendered as given, such as a Secret or a ConfigMap.
extraVolumes: []
# Mounts added to the server's container, rendered as given; each names a volume of extraVolumes.
extraVolumeMounts: []

# Resources of the container.
resources: {}
# Annotations of the pod.
podAnnotations: {}
# Labels of the pod.
podLabels: {}
# Node selector of the pod.
nodeSelector: {}
# Tolerations of the pod.
tolerations: []
# Affinity of the pod.
affinity: {}
