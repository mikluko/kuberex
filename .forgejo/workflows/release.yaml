name: release

# Releases the amd64 and arm64 image and the Helm chart to sarak.sh when the
# newest CHANGELOG.md entry names a version no tag names yet.
#
# The schedule runs half an hour after the renovate workflow, so a version it
# cut is published even where its push starts no run of this one.

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .forgejo/workflows/release.yaml
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

# Serialize releases: a new run queues behind the in-progress one instead of
# cancelling it, so versions publish in order.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The automatic token cannot write packages owned by a user, so the registry
# login trades an OIDC token for an Authorized Integration of the owner's,
# selected by vars.REGISTRY_AUDIENCE and scoped write:package.
enable-openid-connect: true

env:
  REGISTRY: sarak.sh
  IMAGE: sarak.sh/${{ github.repository }}
  CHART_REPOSITORY: oci://sarak.sh/${{ github.repository_owner }}/charts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
      due: ${{ steps.changelog.outputs.due }}
      version: ${{ steps.changelog.outputs.version }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # date-mismatch reads a tag's day in its commit's own UTC offset, while
      # date-future reads today in UTC; v0.22.0's commit, made at 00:00+01:00,
      # can satisfy only one of them.
      - id: changelog
        uses: https://sarak.sh/mikluko/changelog@v1
        with:
          warn: date-mismatch

  image:
    needs: plan
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Log in
        env:
          AUDIENCE: ${{ vars.REGISTRY_AUDIENCE }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | docker login "$REGISTRY" --username oidc --password-stdin
      - name: Build and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:${VERSION%.*}" \
            --tag "$IMAGE:latest" \
            .

  # After the image: a cluster following 0.x would pull a chart naming an
  # image that is not there yet.
  chart:
    needs: [plan, image]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Log in
        env:
          AUDIENCE: ${{ vars.REGISTRY_AUDIENCE }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | helm registry login "$REGISTRY" --username oidc --password-stdin
      - name: Package and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package chart --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/kuberex-$VERSION.tgz" "$CHART_REPOSITORY"

  # Last, so the tag exists only once the image and the chart it names do.
  # rexcity's release workflow moves its FROM to releases/latest and relies
  # on this.
  release:
    needs: [plan, image, chart]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          jq -n --arg tag "$TAG" --arg sha "$SHA" --arg body "$NOTES" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body}' |
            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d @- "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
