name: release

# Releases the amd64 and arm64 image to sarak.sh when the newest CHANGELOG.md
# entry names a version no tag names yet.
#
# On schedule, `pin` first moves Dockerfile's FROM to Debian's newest
# trixie-YYYYMMDD snapshot and records it in CHANGELOG.md: cut as the next
# PATCH when [Unreleased] is empty, which this run then releases, or added to
# [Unreleased] when a release is already pending there.

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .forgejo/workflows/release.yaml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Serialize releases: a new run queues behind the in-progress one instead of
# cancelling it, so versions publish in order.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The automatic token cannot write packages owned by a user, so the registry
# login trades an OIDC token for an Authorized Integration of the owner's,
# selected by vars.REGISTRY_AUDIENCE and scoped write:package.
enable-openid-connect: true

env:
  REGISTRY: sarak.sh
  IMAGE: sarak.sh/${{ github.repository }}
  BASE: debian

jobs:
  pin:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: https://github.com/actions/checkout@v5

      - name: Resolve newest base snapshot
        id: base
        run: |
          # library/debian on Docker Hub: only exact trixie-YYYYMMDD tags, which
          # excludes trixie, trixie-slim and trixie-YYYYMMDD-slim.
          version=$(curl -fsSL 'https://hub.docker.com/v2/repositories/library/debian/tags?page_size=100&name=trixie-' \
            | jq -r '.results[].name | select(test("^trixie-[0-9]{8}$"))' \
            | sort | tail -1)
          if [ -z "$version" ]; then
            echo "::error::no trixie-YYYYMMDD tag of $BASE found"; exit 1
          fi
          current=$(sed -nE "s|^FROM $BASE:([^ ]+).*|\1|p" Dockerfile)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "current=$current" >>"$GITHUB_OUTPUT"

      - id: changelog
        if: steps.base.outputs.version != steps.base.outputs.current
        uses: https://sarak.sh/actions/changelog@v1

      - if: steps.base.outputs.version != steps.base.outputs.current
        uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Record the bump
        id: record
        if: steps.base.outputs.version != steps.base.outputs.current
        env:
          VERSION: ${{ steps.base.outputs.version }}
          CURRENT: ${{ steps.changelog.outputs.version }}
          PENDING: ${{ steps.changelog.outputs.due }}
        run: |
          if [ "$PENDING" = true ]; then
            echo "::error file=CHANGELOG.md::$CURRENT is not released yet; release it before the base moves"
            exit 1
          fi
          sed -i -E "s|^FROM $BASE:[^ ]+|FROM $BASE:$VERSION|" Dockerfile
          cut=$(go run ./cmd/record-base-bump \
            -current "$CURRENT" -date "$(date -u +%F)" \
            -entry "Base image is \`$BASE:$VERSION\`.")
          echo "cut=$cut" >>"$GITHUB_OUTPUT"
          git diff

      - name: Commit
        id: commit
        env:
          VERSION: ${{ steps.base.outputs.version }}
          CUT: ${{ steps.record.outputs.cut }}
        run: |
          if git diff --quiet; then
            echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'forgejo-actions'
          git config user.email 'actions@sarak.sh'
          git commit -qam "Pin base to $BASE:$VERSION"
          git push
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [ -z "$CUT" ]; then
            echo "::notice::$BASE:$VERSION recorded under [Unreleased]; it ships with the pending release"
          fi

  # Forgejo skips a job whose need was skipped unless its condition calls
  # always(); pin is skipped on push.
  plan:
    needs: pin
    if: ${{ always() && needs.pin.result != 'failure' && needs.pin.result != 'cancelled' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      due: ${{ steps.changelog.outputs.due }}
      version: ${{ steps.changelog.outputs.version }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - id: ref
        env:
          PINNED: ${{ needs.pin.outputs.sha }}
        run: echo "sha=${PINNED:-$GITHUB_SHA}" >>"$GITHUB_OUTPUT"
      - uses: https://github.com/actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changelog
        uses: https://sarak.sh/actions/changelog@v1

  image:
    needs: plan
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Log in
        env:
          AUDIENCE: ${{ vars.REGISTRY_AUDIENCE }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | docker login "$REGISTRY" --username oidc --password-stdin
      - name: Build and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:${VERSION%.*}" \
            --tag "$IMAGE:latest" \
            .

  # Last, so the tag exists only once the image it names does.
  release:
    needs: [plan, image]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          jq -n --arg tag "$TAG" --arg sha "$SHA" --arg body "$NOTES" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body}' |
            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d @- "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
