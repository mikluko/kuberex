name: upgrade

# Moves Dockerfile's FROM to Debian's newest trixie-YYYYMMDD snapshot, and
# REX_VERSION and CLAUDE_CODE_VERSION to the newest Rex and Claude Code in the
# channels apt/sources.list.d names, notes each move under Changed in
# CHANGELOG.md's [Unreleased], turns [Unreleased] into the version the
# changelog release action computes, and pushes the result to main for the
# release workflow to publish. Rex's snapshot index keeps only its newest
# builds, so this daily run is what keeps the image buildable. Claude Code's
# own update check is off in the image, so this run is also how it gets newer.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BASE: debian

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5

      - name: Resolve newest base snapshot
        id: base
        run: |
          # library/debian on Docker Hub: only exact trixie-YYYYMMDD tags, which
          # excludes trixie, trixie-slim and trixie-YYYYMMDD-slim.
          version=$(curl -fsSL 'https://hub.docker.com/v2/repositories/library/debian/tags?page_size=100&name=trixie-' \
            | jq -r '.results[].name | select(test("^trixie-[0-9]{8}$"))' \
            | sort | tail -1)
          if [ -z "$version" ]; then
            echo "::error::no trixie-YYYYMMDD tag of $BASE found"; exit 1
          fi
          current=$(sed -nE "s|^FROM $BASE:([^ ]+).*|\1|p" Dockerfile)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "moved=$([ "$version" != "$current" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      # apt in the new base reads the indexes through the image's own sources
      # and keyrings, so signatures are checked and versions compare as dpkg
      # compares them. The runner has no Docker daemon, only the remote
      # buildx builder the image job uses. A version is taken only once both
      # architectures have it.
      - name: Resolve newest Rex and Claude Code
        id: pkg
        env:
          DEBIAN: ${{ steps.base.outputs.version }}
        run: |
          docker buildx build --no-cache --platform linux/amd64 \
            --build-arg "BASE=$BASE:$DEBIAN" \
            --file .forgejo/candidates.Dockerfile \
            --output "type=local,dest=$RUNNER_TEMP/pkg" \
            apt
          # resolve PACKAGE ARG KEY writes KEY_version and KEY_moved for the
          # Dockerfile ARG that pins PACKAGE.
          resolve() {
            amd64=$(awk -v p="$1" '$1 == p && $2 == "amd64" { print $3 }' "$RUNNER_TEMP/pkg/candidates")
            arm64=$(awk -v p="$1" '$1 == p && $2 == "arm64" { print $3 }' "$RUNNER_TEMP/pkg/candidates")
            version=
            if [ -z "$amd64" ] || [ "$amd64" = "(none)" ] || [ -z "$arm64" ] || [ "$arm64" = "(none)" ]; then
              echo "::error::no $1 package for amd64 and arm64 in the channels apt/sources.list.d names"
              return 1
            elif [ "$amd64" != "$arm64" ]; then
              echo "::warning::$1 is $amd64 for amd64 and $arm64 for arm64; it moves once both have the same"
            else
              version=$amd64
            fi
            current=$(sed -nE "s|^ARG $2=(.+)|\1|p" Dockerfile)
            echo "$3_version=$version" >>"$GITHUB_OUTPUT"
            echo "$3_moved=$([ -n "$version" ] && [ "$version" != "$current" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          }
          resolve rex REX_VERSION rex
          resolve claude-code CLAUDE_CODE_VERSION claude

      - name: Pin base
        if: steps.base.outputs.moved == 'true'
        env:
          VERSION: ${{ steps.base.outputs.version }}
        run: sed -i -E "s|^FROM $BASE:[^ ]+|FROM $BASE:$VERSION|" Dockerfile
      - if: steps.base.outputs.moved == 'true'
        uses: https://sarak.sh/actions/changelog/append@v1
        with:
          section: Changed
          note: Base image is `${{ env.BASE }}:${{ steps.base.outputs.version }}`.

      - name: Pin Rex
        if: steps.pkg.outputs.rex_moved == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.rex_version }}
        run: sed -i -E "s|^ARG REX_VERSION=.+|ARG REX_VERSION=$VERSION|" Dockerfile
      - if: steps.pkg.outputs.rex_moved == 'true'
        uses: https://sarak.sh/actions/changelog/append@v1
        with:
          section: Changed
          note: Rex is `${{ steps.pkg.outputs.rex_version }}`.

      - name: Pin Claude Code
        if: steps.pkg.outputs.claude_moved == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.claude_version }}
        run: sed -i -E "s|^ARG CLAUDE_CODE_VERSION=.+|ARG CLAUDE_CODE_VERSION=$VERSION|" Dockerfile
      - if: steps.pkg.outputs.claude_moved == 'true'
        uses: https://sarak.sh/actions/changelog/append@v1
        with:
          section: Changed
          note: Claude Code is `${{ steps.pkg.outputs.claude_version }}`.

      - id: release
        if: steps.base.outputs.moved == 'true' || steps.pkg.outputs.rex_moved == 'true' || steps.pkg.outputs.claude_moved == 'true'
        uses: https://sarak.sh/actions/changelog/release@v1

      - name: Commit
        if: steps.base.outputs.moved == 'true' || steps.pkg.outputs.rex_moved == 'true' || steps.pkg.outputs.claude_moved == 'true'
        env:
          BASE_MOVED: ${{ steps.base.outputs.moved }}
          BASE_VERSION: ${{ steps.base.outputs.version }}
          REX_MOVED: ${{ steps.pkg.outputs.rex_moved }}
          REX_VERSION: ${{ steps.pkg.outputs.rex_version }}
          CLAUDE_MOVED: ${{ steps.pkg.outputs.claude_moved }}
          CLAUDE_VERSION: ${{ steps.pkg.outputs.claude_version }}
          RELEASE: ${{ steps.release.outputs.version }}
        run: |
          git diff
          pins=
          if [ "$BASE_MOVED" = true ]; then pins="base to $BASE:$BASE_VERSION"; fi
          if [ "$REX_MOVED" = true ]; then pins="${pins:+$pins, }Rex to $REX_VERSION"; fi
          if [ "$CLAUDE_MOVED" = true ]; then pins="${pins:+$pins, }Claude Code to $CLAUDE_VERSION"; fi
          git config user.name 'forgejo-actions'
          git config user.email 'actions@sarak.sh'
          git commit -qam "kuberex $RELEASE: pin $pins"
          git push
