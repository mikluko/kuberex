name: test

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - chart/**
      - .forgejo/workflows/test.yaml
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  chart:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      CILIUM_SCHEMA: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          persist-credentials: false
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: CRD schemas
        run: |
          # Go's regexp rejects the \uXXXX escapes in the Cilium schema's
          # patterns, and kubeconform then reports the schema as missing.
          mkdir -p "$RUNNER_TEMP/schemas/cilium.io"
          curl -fsSL "$CILIUM_SCHEMA" |
            jq 'walk(if type == "object" and (.pattern | type) == "string"
                then .pattern |= gsub("\\\\u(?<h>[0-9a-fA-F]{4})"; "\\x{\(.h)}") else . end)' \
            >"$RUNNER_TEMP/schemas/cilium.io/ciliumnetworkpolicy_v2.json"
      - name: Chart lints and renders valid manifests
        run: |
          for f in chart/ci/*.yaml; do
            helm lint --strict chart -f "$f"
            helm template kuberex chart -f "$f" |
              kubeconform -strict -summary \
                -schema-location default \
                -schema-location "$RUNNER_TEMP/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          done

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # 0.22.0 is dated a day before its tag, and a released entry may not change.
      - uses: https://sarak.sh/mikluko/changelog/actions/validate@v2
        with:
          fragments: ""
          warn: date-mismatch

  # Builds the image for both architectures without pushing it: a pin one
  # architecture lacks, or a package apt cannot verify, fails in the pull
  # request and not at the release.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 --progress plain .
