name: test

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .forgejo/workflows/test.yaml
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
